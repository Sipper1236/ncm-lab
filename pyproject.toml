[project]
name = "ncm-lab"
version = "0.1.0"
description = "A small Vulkan- and CPU-capable NCM agent with multi-step tool use."
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "torch>=2.5"]

[project.scripts]
ncm-train = "ncm_lab.train:main"
ncm-sample = "ncm_lab.sample:main"
ncm-agent = "ncm_lab.agent:main"

[project.optional-dependencies]
vulkan = [
    "torchvulkan>=0.2.2,<0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
